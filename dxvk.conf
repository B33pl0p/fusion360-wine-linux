# dxvk.conf — DXVK configuration for Fusion 360 on Intel iGPU (Coffee Lake / ANV)
#
# Place this file at: drive_c/dxvk.conf  (inside your Bottles Fusion360 bottle)
# Then set environment variable in bottle.yml:
#   DXVK_CONFIG_FILE = C:\dxvk.conf
#
# Problem:
#   DXVK 2.x uses VK_EXT_graphics_pipeline_library for async pipeline
#   compilation. Intel's ANV Vulkan driver (used on Iris Plus / Coffee Lake
#   iGPUs) has a bug with this extension that causes a GPU crash the moment the
#   first 3D scene renders. The crash appears in Bottles logs as:
#       [CreateNewDocTask END]
#   followed by a GPU hang / device lost error.
#
# Fix:
#   Disable graphics_pipeline_library and async pipeline compilation so DXVK
#   falls back to synchronous pipeline building. There will be minor stutters
#   the first time each pipeline is compiled, but the app will be stable.
#
# Do NOT use wined3d (d3d11=builtin) as a workaround — wined3d on Wayland /
# XWayland produces a completely blank 3D viewport even though the rest of the
# app loads successfully.

[dxvk]
dxvk.enableGraphicsPipelineLibrary = Disabled
dxvk.enableAsync = False
